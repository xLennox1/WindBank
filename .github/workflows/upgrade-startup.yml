name: Upgrade WindBank startup
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[startup-upgraded]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade startup animation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''/* cinematic startup */
          #startup{position:fixed;inset:0;z-index:99999;background:#020207;overflow:hidden;display:grid;place-items:center;transition:opacity 1s ease,visibility 1s ease;isolation:isolate}
          #startup.hide{opacity:0;visibility:hidden;pointer-events:none}
          #startup .space{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#4f43b52b 0,#17132c22 28%,#020207 68%)}
          #startup .stars{position:absolute;inset:-20%;background-image:radial-gradient(circle,#fff 1px,transparent 1.7px),radial-gradient(circle,#b9b1ff 1px,transparent 1.7px);background-size:73px 73px,131px 131px;opacity:.22;animation:wbStars 8s linear infinite}
          #startup .pulse{position:absolute;width:min(72vw,720px);aspect-ratio:1;border-radius:50%;border:1px solid #9d92ff20;box-shadow:0 0 120px #786bff12 inset;animation:wbPulse 2.6s ease-out infinite}
          #startup .pulse.p2{width:min(50vw,500px);animation-delay:.7s}
          #startup .orbit{position:absolute;width:min(68vw,620px);aspect-ratio:1;border:1px solid #bcb5ff35;border-radius:50%;animation:wbSpin 6s linear infinite}
          #startup .orbit.o2{width:min(84vw,780px);animation-duration:11s;animation-direction:reverse;border-color:#8d7cff20}
          #startup .orbit.o3{width:min(48vw,440px);animation-duration:4s;border-style:dashed;border-color:#fff1}
          #startup .orbit i{position:absolute;width:8px;height:8px;border-radius:50%;background:#d8d3ff;box-shadow:0 0 25px 7px #8d7cff;left:50%;top:-4px}
          #startup .vault{position:relative;width:min(210px,42vw);height:min(210px,42vw);border-radius:46px;background:linear-gradient(145deg,#e2dfff 0,#a49aff 27%,#6557e5 58%,#30257d 100%);display:grid;place-items:center;box-shadow:0 0 55px #8d7cff99,0 0 180px #6659e533,0 35px 100px #000;animation:wbVault 1.35s cubic-bezier(.16,1,.3,1) both}
          #startup .vault:before{content:"";position:absolute;inset:12px;border-radius:37px;border:1px solid #ffffff77;box-shadow:inset 0 0 30px #ffffff18}
          #startup .vault:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 0 28px 10px #fff8;animation:wbBlink .9s ease-in-out infinite alternate}
          #startup .vmark{font-size:clamp(82px,13vw,112px);font-weight:1000;letter-spacing:-.12em;color:#fff;transform:translateX(-5px);text-shadow:0 4px 30px #30257d;animation:wbMark 1.2s .15s cubic-bezier(.16,1,.3,1) both}
          #startup .shock{position:absolute;width:25px;height:25px;border:2px solid #fff;border-radius:50%;opacity:0;animation:wbShock 1.2s 1.1s ease-out both}
          #startup .shard{position:absolute;width:4px;height:26px;border-radius:9px;background:linear-gradient(#fff,#8d7cff);box-shadow:0 0 15px #8d7cff;animation:wbShard 1.5s ease-out both;transform-origin:center bottom}
          #startup .start-copy{position:absolute;top:calc(50% + min(190px,27vw));text-align:center;width:100%}
          #startup .start-name{font-size:clamp(30px,5vw,42px);font-weight:950;letter-spacing:-.06em;animation:wbFadeUp .8s .45s both}
          #startup .start-sub{margin-top:8px;color:#a6a2b5;font-size:10px;letter-spacing:.34em;text-transform:uppercase;animation:wbFadeUp .8s .6s both}
          #startup .progress{width:min(290px,62vw);height:3px;background:#20202d;border-radius:99px;overflow:hidden;margin:22px auto 0;animation:wbFadeUp .8s .7s both}
          #startup .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5e50dd,#fff,#8d7cff,#5e50dd);background-size:220% 100%;animation:wbLoad 2.7s .4s cubic-bezier(.2,.8,.2,1) forwards,wbShine 1s linear infinite}
          #startup .sound-btn{margin-top:16px;border:1px solid #504b78;background:#121022dd;color:#e9e6ff;border-radius:11px;padding:9px 13px;font-weight:800;font-size:12px;backdrop-filter:blur(10px);animation:wbFadeUp .8s .8s both}
          @keyframes wbVault{from{opacity:0;transform:scale(.18) rotate(-35deg);filter:blur(18px)}55%{transform:scale(1.12) rotate(5deg)}to{opacity:1;transform:scale(1) rotate(0);filter:none}}
          @keyframes wbMark{from{opacity:0;transform:scale(.15) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(0)}}
          @keyframes wbFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
          @keyframes wbSpin{to{transform:rotate(360deg)}}
          @keyframes wbStars{to{transform:translate3d(50px,100px,0)}}
          @keyframes wbPulse{0%{transform:scale(.55);opacity:0}35%{opacity:.7}100%{transform:scale(1.2);opacity:0}}
          @keyframes wbShock{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(25)}}
          @keyframes wbShard{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.2)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}
          @keyframes wbBlink{to{opacity:.45;box-shadow:0 0 8px 2px #fff4}}
          @keyframes wbLoad{to{width:100%}}@keyframes wbShine{to{background-position:220% 0}}
          @media(max-width:720px){#startup .start-copy{top:calc(50% + 135px)}#startup .sound-btn{font-size:11px}}
          @media(prefers-reduced-motion:reduce){#startup *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
          '''
          s=re.sub(r'/\* cinematic startup \*/.*?(?=header\{)',css,s,count=1,flags=re.S)
          intro='''<div id="startup"><div class="space"></div><div class="stars"></div><div class="pulse"></div><div class="pulse p2"></div><div class="orbit"><i></i></div><div class="orbit o2"><i></i></div><div class="orbit o3"><i></i></div><div class="vault"><div class="vmark">W</div></div><div class="shock"></div><div class="start-copy"><div class="start-name">WindBank</div><div class="start-sub">Wind SMP Finance</div><div class="progress"><i></i></div><button class="sound-btn" id="startupSound" type="button">🔊 Sound aktivieren</button></div></div>'''
          s=re.sub(r'<div id="startup">.*?</div>\s*<header>',intro+'\n<header>',s,count=1,flags=re.S)
          sound=r'''<script>
          (()=>{
            const btn=document.getElementById('startupSound');
            let ctx;
            function tone(freq,start,duration,type='sine',gain=.035){
              if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);o.frequency.exponentialRampToValueAtTime(freq*1.8,start+duration);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.03);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(ctx.destination);o.start(start);o.stop(start+duration+.02)
            }
            btn?.addEventListener('click',()=>{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();const t=ctx.currentTime;tone(90,t,.45,'sine',.06);tone(180,t+.35,.55,'triangle',.04);tone(360,t+.7,.7,'sine',.025);btn.textContent='✓ Sound aktiviert';setTimeout(()=>document.getElementById('startup')?.classList.add('hide'),900)});
            window.addEventListener('load',()=>setTimeout(()=>document.getElementById('startup')?.classList.add('hide'),4200));
          })();
          </script>
          '''
          marker='<script>\nconst DEFAULT_ITEMS='
          if 'id="startupSound"' in s and 'const DEFAULT_ITEMS=' in s and 'startupSound' not in s.split('const DEFAULT_ITEMS=',1)[1][:200]:
              s=s.replace(marker,sound+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit upgraded startup
        run: |
          git config user.name 'WindBank Bot'
          git config user.email 'windbank-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Upgrade WindBank startup animation [startup-upgraded]' && git push)
