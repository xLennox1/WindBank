name: Install WindBank modern UI
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[modern-ui-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject modern UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/modern-ui.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit modern UI integration
        run: |
          git config user.name 'WindBank Bot'
          git config user.email 'windbank-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Integrate mobile Minecraft modern UI [modern-ui-installed]' && git push)
