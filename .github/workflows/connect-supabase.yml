name: Connect WindBank to Supabase
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[supabase-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Supabase client
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/supabase-live.js" defer></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'WindBank Bot'
          git config user.email 'windbank-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Connect WindBank marketplace to Supabase [supabase-injected]' && git push)
